name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pr-wait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pr-wait regression tests
        run: bash skills/landing-prs/pr-wait_test.sh
      - name: merge-audit regression tests
        run: bash skills/merge-attribution/merge-audit_test.sh
      - name: cloud agent install checks
        run: bash .cursor/install_test.sh
